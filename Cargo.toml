[package]
name = "codasaurus"
version = "0.1.0"
edition = "2021"
description = "🦕 Codasaurus — munches on AI-generated bugs so you don't have to. Catches hallucinated imports, phantom deps, security holes, and over-engineered slop. Works locally, in CI, and as a GitHub bot."
authors = ["Lohit Kolluri <lohitkolluri@gmail.com>"]
license = "MIT"
repository = "https://github.com/lohitkolluri/codasaurus"
homepage = "https://github.com/lohitkolluri/codasaurus"
keywords = ["code-review", "ai", "verification", "cli", "security", "openrouter", "codasaurus"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & Async
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Terminal output
colored = "3"
terminal_size = "0.4"

# Parsing (regex-based for MVP; tree-sitter AST parsing will be added in a future release)

# Config
dirs = "6"

# Lazy init
once_cell = "1"

# Regex & text processing
regex = "1"
lazy_static = "1"

# File watching (for watch mode)
notify = "7"

# Directory traversal
walkdir = "2"

# Git (using std::process::Command instead)

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
