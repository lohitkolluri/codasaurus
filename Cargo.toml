[package]
name = "codasaurus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Self-hosted GitHub App PR review agent — Tier-1 detectors, BYOK LLM, walkthroughs, and slash commands."
authors = ["Lohit Kolluri <lohitkolluri@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/lohitkolluri/codasaurus"
homepage = "https://github.com/lohitkolluri/codasaurus"
documentation = "https://github.com/lohitkolluri/codasaurus#readme"
readme = "README.md"
keywords = ["code-review", "ai", "github-app", "security", "openrouter", "codasaurus", "self-hosted"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

# HTTP & Async
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "http2", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

# Error handling
anyhow = "1"

# Config / paths
dirs = "6"

# Regex & text processing
regex = "1"

# Multi-pattern string matching
aho-corasick = "1"

# Directory traversal (repo context helpers / tests)
walkdir = "2"

# Web server (for GitHub App bot)
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "limit", "trace"] }
tower = { version = "0.5", features = ["timeout", "util"] }

# Database (Postgres + TLS for Render / Neon / Supabase / etc.)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Password hashing
argon2 = "0.5"

# JWT generation (for GitHub App auth)
jsonwebtoken = { version = "9", features = ["use_pem"] }

# Crypto
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Code graph
petgraph = "0.7"

# Base64 (for PaaS-safe env var encoding of PEM keys)
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
# Prefer speed for the long-lived review server (detectors/JSON/LLM paths).
# Use opt-level = "z" only when binary size is the primary constraint.
opt-level = 3
panic = "abort"
