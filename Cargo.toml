[package]
name = "codasaurus"
version = "0.1.0"
edition = "2021"
description = "🦕 Codasaurus — munches on AI-generated bugs so you don't have to. Catches hallucinated imports, phantom deps, security holes, and AI slop. Works locally, in CI, and as a GitHub bot."
authors = ["Lohit Kolluri <lohitkolluri@gmail.com>"]
license = "MIT"
repository = "https://github.com/lohitkolluri/codasaurus"
homepage = "https://github.com/lohitkolluri/codasaurus"
documentation = "https://github.com/lohitkolluri/codasaurus#readme"
readme = "README.md"
keywords = ["code-review", "ai", "verification", "cli", "security", "openrouter", "codasaurus"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & Async
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "http2", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

# Error handling
anyhow = "1"

# Terminal output
colored = "3"

# TUI (interactive review mode)
ratatui = "0.29"
crossterm = "0.28"

# Config
dirs = "6"

# Regex & text processing
regex = "1"

# Multi-pattern string matching
aho-corasick = "1"

# File watching (for watch mode)
notify = "7"

# Directory traversal
walkdir = "2"

# Web server (for GitHub App bot)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

# Database (for feedback learning loop)
rusqlite = { version = "0.40", features = ["bundled"] }

# JWT generation (for GitHub App auth)
jsonwebtoken = { version = "9", features = ["use_pem"] }

# Crypto
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Code graph
petgraph = "0.7"

# Base64 (for PaaS-safe env var encoding of PEM keys)
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
