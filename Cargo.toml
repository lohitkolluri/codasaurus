[package]
name = "codasaurus"
version = "0.1.0"
edition = "2021"
description = "🦕 Codasaurus — munches on AI-generated bugs so you don't have to. Catches hallucinated imports, phantom deps, security holes, and AI slop. Works locally, in CI, and as a GitHub bot."
authors = ["Lohit Kolluri <lohitkolluri@gmail.com>"]
license = "MIT"
repository = "https://github.com/lohitkolluri/codasaurus"
homepage = "https://github.com/lohitkolluri/codasaurus"
keywords = ["code-review", "ai", "verification", "cli", "security", "openrouter", "codasaurus"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & Async
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Terminal output
colored = "3"
terminal_size = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Parsing (regex-based for MVP; tree-sitter AST parsing will be added in a future release)

# Config
dirs = "6"

# Lazy init
once_cell = "1"

# Regex & text processing
regex = "1"
lazy_static = "1"

# File watching (for watch mode)
notify = "7"

# Directory traversal
walkdir = "2"

# Terminal components (spinners, progress bars)
clx = "2"

# Web server (for GitHub App bot)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = "0.7"

# Database (for feedback learning loop)
rusqlite = { version = "0.34", features = ["bundled"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }

# JWT generation (for GitHub App auth)
jsonwebtoken = "9"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# JSONPath / querying
serde_json_path = "0.7"

# Code graph (tree-sitter AST analysis)
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
petgraph = "0.7"

# Git (using std::process::Command instead)

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
