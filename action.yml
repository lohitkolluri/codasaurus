name: 'Codasaurus'
description: '🦕 AI-generated code verification — catches hallucinated imports, phantom deps, stale APIs, and security issues'
author: 'Lohit Kolluri'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: 'Check mode: ci (default) or staged'
    required: false
    default: 'ci'
  diff:
    description: 'Git ref to diff against (default: origin/main)'
    required: false
    default: 'origin/main'
  config:
    description: 'Path to .codasaurus.toml config'
    required: false
    default: ''
  fail-on:
    description: 'Fail on severity level: blocking (default), warning, never'
    required: false
    default: 'blocking'

runs:
  using: 'composite'
  steps:
    - name: Install Codasaurus
      shell: bash
      run: |
        if ! command -v codasaurus &> /dev/null; then
          echo "Installing Codasaurus..."
          if command -v cargo &> /dev/null; then
            cargo install codasaurus --root /tmp/codasaurus-install
            export PATH="/tmp/codasaurus-install/bin:$PATH"
          else
            # Download pre-built binary
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then ARCH="amd64"; fi
            curl -sL "https://github.com/lohitkolluri/codasaurus/releases/latest/download/codasaurus-${OS}-${ARCH}.tar.gz" | tar xz -C /tmp
            chmod +x /tmp/codasaurus
            export PATH="/tmp:$PATH"
          fi
        fi

    - name: Run Codasaurus
      shell: bash
      run: |
        ARGS=""
        if [ -n "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config }}"
        fi
        if [ "${{ inputs.mode }}" = "ci" ]; then
          ARGS="$ARGS --diff ${{ inputs.diff }} --ci"
        elif [ "${{ inputs.mode }}" = "staged" ]; then
          ARGS="$ARGS --staged"
        fi
        codasaurus check $ARGS
