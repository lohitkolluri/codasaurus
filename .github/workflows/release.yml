name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: codasaurus

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      archive_sha: ${{ steps.package.outputs.archive_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus-release

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: svelte-dashboard/package-lock.json

      - name: Build dashboard
        working-directory: svelte-dashboard
        run: npm ci && npm run build

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare staging directory
        run: |
          staging="${{ env.BINARY_NAME }}-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          mkdir -p "$staging"
          cp target/release/${{ env.BINARY_NAME }} "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/" 2>/dev/null || true
          echo "$staging"

      - name: Package archive
        id: package
        run: |
          staging="${{ env.BINARY_NAME }}-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          archive="${staging}.tar.gz"
          tar czf "$archive" "$staging/"
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "$sha" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: ${{ env.BINARY_NAME }}-*.tar.gz*

  create-release:
    name: Create Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Generate release notes
        id: release_notes
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          {
            echo 'notes<<EOF'
            if [ -f CHANGELOG.md ] && grep -q "## \[${ver}\]" CHANGELOG.md; then
              # Excerpt the matching CHANGELOG section (until next ## or EOF).
              awk -v ver="$ver" '
                $0 ~ "^## \\[" ver "\\]" {grab=1; next}
                grab && /^## / {exit}
                grab {print}
              ' CHANGELOG.md
            else
              prev_tag=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
              if [ -n "$prev_tag" ]; then
                git log "$prev_tag".."$tag" --oneline --no-decorate
              else
                echo "Initial release ${tag}."
                echo ""
                echo "See CHANGELOG.md for details."
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BINARY_NAME }}-*.tar.gz*
          body: |
            ## Codasaurus ${{ github.ref_name }}

            ${{ steps.release_notes.outputs.notes }}

            ---
            **Install:** extract the tarball and run `./codasaurus serve`. Needs PostgreSQL (`DATABASE_URL`).
            **Docs:** [README](https://github.com/lohitkolluri/codasaurus#readme) · [Changelog](https://github.com/lohitkolluri/codasaurus/blob/main/CHANGELOG.md)

