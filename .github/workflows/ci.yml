name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codasaurus
          POSTGRES_PASSWORD: codasaurus
          POSTGRES_DB: codasaurus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codasaurus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://codasaurus:codasaurus@127.0.0.1:5432/codasaurus
      CODASAURUS_TEST_DATABASE_URL: postgres://codasaurus:codasaurus@127.0.0.1:5432/codasaurus
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        # RUSTSEC-2023-0071 (rsa / Marvin Attack): no patched rsa release yet.
        # Pulled in via jsonwebtoken for GitHub App JWT minting. Exploit needs a
        # remote timing oracle against RSA private-key ops; signing here is
        # local/low-volume. Revisit when upstream ships a fix or we migrate crypto.
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Run tests
        run: cargo test --locked

  cargo-deny:
    name: License / Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses and bans
        run: cargo-deny check licenses bans sources

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: svelte-dashboard/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Build dashboard
        working-directory: svelte-dashboard
        run: npm ci && npm run build
      - name: Build
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codasaurus
          path: target/release/codasaurus
