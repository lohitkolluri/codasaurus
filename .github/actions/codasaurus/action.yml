name: 'Codasaurus Review'
description: 'AI-powered code review for PRs — detects hallucinated imports, phantom deps, secrets, stale APIs, and more'
author: 'codasaurus'
inputs:
  github_token:
    description: 'GitHub token'
    required: true
    default: ${{ github.token }}
  config_path:
    description: 'Path to .codasaurus.toml config file'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: codasaurus-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
    - name: Install codasaurus
      run: |
        if ! command -v codasaurus &> /dev/null; then
          cargo install codasaurus --locked
        else
          echo "codasaurus already installed"
        fi
      shell: bash
    - name: Run codasaurus review
      run: codasaurus check-run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CODASAURUS_CONFIG: ${{ inputs.config_path }}
