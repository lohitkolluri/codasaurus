services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codasaurus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codasaurus}
      POSTGRES_DB: codasaurus
    volumes:
      - codasaurus-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codasaurus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  codasaurus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://codasaurus:${POSTGRES_PASSWORD:-codasaurus}@postgres:5432/codasaurus
      - CODASAURUS_DATA_DIR=/data
      - PORT=3000
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_B64=${GITHUB_APP_PRIVATE_KEY_B64:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CODASAURUS_MODEL=${CODASAURUS_MODEL:-}
      - CODASAURUS_BASE_URL=${CODASAURUS_BASE_URL:-}
      - CODASAURUS_MAX_CONCURRENT_REVIEWS=${CODASAURUS_MAX_CONCURRENT_REVIEWS:-4}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
    volumes:
      - codasaurus-data:/data
    tmpfs:
      - /tmp:size=64M,mode=1777
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "codasaurus", "health", "--ready"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

volumes:
  codasaurus-data:
  codasaurus-pg:
