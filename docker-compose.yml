services:
  codasaurus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/codasaurus.db?mode=rwc}
      - CODASAURUS_DATA_DIR=/data
      - PORT=3000
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_B64=${GITHUB_APP_PRIVATE_KEY_B64:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CODASAURUS_MODEL=${CODASAURUS_MODEL:-}
      - CODASAURUS_BASE_URL=${CODASAURUS_BASE_URL:-}
      - CODASAURUS_MAX_CONCURRENT_REVIEWS=${CODASAURUS_MAX_CONCURRENT_REVIEWS:-4}
    volumes:
      - codasaurus-data:/data
    # Writable temp for SQLite WAL / uploads when rootfs is read-only
    tmpfs:
      - /tmp:size=64M,mode=1777
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "codasaurus", "health", "--port", "3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

volumes:
  codasaurus-data:
