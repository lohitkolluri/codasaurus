services:
  init-data:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data"]
    volumes:
      - codasaurus-data:/data

  codasaurus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID:?error}
      # Use base64-encoded key to avoid PEM newline issues in .env files:
      - GITHUB_APP_PRIVATE_KEY_B64=${GITHUB_APP_PRIVATE_KEY_B64:?error}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?error}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=3000
      - CODASAURUS_DATA_DIR=/data
    volumes:
      - codasaurus-data:/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/codasaurus", "health", "--port", "3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

volumes:
  codasaurus-data:
